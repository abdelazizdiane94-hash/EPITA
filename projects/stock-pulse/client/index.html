<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPulse Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>StockPulse Dashboard</h1>
        <p>Visualisez et gérez vos stocks en temps réel.</p>
    </header>
    <main>
        <section id="inventory">
            <h2>Inventaire</h2>
            <div class="chart-container"><canvas id="stockChart"></canvas></div>
            <div class="stock-controls">
                <label for="product-select">Produit</label>
                <select id="product-select"></select>
                <label for="movement-quantity">Quantité</label>
                <input id="movement-quantity" type="number" min="1" value="5">
                <button id="stock-in" type="button">Entrée de stock</button>
                <button id="stock-out" type="button">Sortie de stock</button>
            </div>
            <p id="stock-status" role="status">Données de démonstration chargées.</p>
            <ul id="inventoryList"></ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 M'Fabdel-Aziz (Abdel-Aziz) DIANÉ</p>
    </footer>
</body>
</html>
